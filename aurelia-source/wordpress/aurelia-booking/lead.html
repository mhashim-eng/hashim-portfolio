<form class="lead-form"><p class="demo-note">Demo form: previews locally; nothing is sent.</p><div class="form-grid"><label>Full name<input name="name" maxlength="100" required autocomplete="name"></label><label>Email address<input name="email" type="email" required autocomplete="email"></label><label>Phone (optional)<input name="phone" type="tel" maxlength="32"></label><label>Inquiry category<select name="category"><option>General question</option><option>Appointment support</option><option>Service information</option></select></label><label>Requested service<select name="service"><option value="">Not sure yet</option><option value="signature">Signature Facial</option><option value="hydrating">Hydrating Facial</option><option value="skin">Skin Consultation</option><option value="led">LED Facial Experience</option><option value="relaxation">Relaxation Facial</option><option value="wellness">Wellness Consultation</option></select></label></div><label>Your message<textarea name="message" rows="5" minlength="10" maxlength="2000" required placeholder="General questions only. Do not include health information."></textarea></label><label class="consent"><input type="checkbox" name="consent" required><span>I have read the <a href="{{POLICIES}}#privacy">privacy notice</a> and agree to be contacted about this inquiry.</span></label><label class="honeypot">Leave empty<input name="website" tabindex="-1" autocomplete="off"></label><button class="btn" type="submit">Preview inquiry ↗</button><p class="form-status" role="status"></p></form>
