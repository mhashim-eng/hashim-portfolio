<details class="manage"><summary>Manage an appointment</summary><p>For WordPress bookings, enter the private reference and management code from your email. Public demo appointments can be cancelled here by selecting the saved reference.</p><div id="demo-bookings"></div><form id="manage-form"><label>Booking reference<input name="reference" required maxlength="40"></label><label>Private management code<input name="token" required maxlength="80" type="password" autocomplete="off"></label><label>Action<select name="action"><option value="cancel">Cancel appointment</option><option value="reschedule">Reschedule appointment</option></select></label><label>New date (reschedule only)<input type="date" name="date"></label><label>New time in Miami (reschedule only)<input type="time" name="time" step="900"></label><button class="btn" type="submit">Apply change</button><p class="form-status" role="status"></p></form><button type="button" id="clear-demo" class="text-button">Clear demo appointments</button></details>
